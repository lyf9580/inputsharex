[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inputsharex"
version = "0.5.4"
description = "Windows 鼠标/键盘共享到 Android（加密直连与 ADB），支持绝对坐标跨屏与触摸手势"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Unlicense" }
authors = [{ name = "inputsharex" }]
dependencies = ["cryptography>=43", "segno>=1.5"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]

[project.scripts]
inputsharex = "inputsharex.cli:main"
inputsharex-gui = "inputsharex.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
