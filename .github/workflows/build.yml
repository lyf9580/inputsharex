name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      apk: ${{ steps.version.outputs.apk }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=inputsharex-android-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Use official Gradle distribution
        shell: bash
        working-directory: android
        run: |
          # 仓库默认使用国内镜像下载 Gradle 与 Maven 依赖；GitHub runner 在海外，官方源更快更稳。
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven\.aliyun\.com/d' settings.gradle.kts
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          grep -c aliyun settings.gradle.kts || true

      - name: Build Android APK
        shell: bash
        working-directory: android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_RELEASE_KEYSTORE_BASE64 || '' }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_RELEASE_STORE_PASSWORD || '' }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_RELEASE_KEY_ALIAS || '' }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_RELEASE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            for name in RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Missing Android release signing secret: $name"
                exit 1
              fi
            done
            umask 077
            export ANDROID_RELEASE_KEYSTORE="$(mktemp "$RUNNER_TEMP/inputsharex-signing.XXXXXX")"
            trap 'rm -f "$ANDROID_RELEASE_KEYSTORE"' EXIT
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
            fingerprint="$(keytool -exportcert -keystore "$ANDROID_RELEASE_KEYSTORE" \
              -storepass:env ANDROID_RELEASE_STORE_PASSWORD -alias "$ANDROID_RELEASE_KEY_ALIAS" \
              | sha256sum | cut -d ' ' -f 1)"
            if [[ "$fingerprint" == 9305aa72ed4b3cf87039607b9b1b6778dafe5740f00de0cfa10da064772961b3 ]]; then
              echo "::error::The old public Android signing key cannot be used for releases."
              exit 1
            fi
            timeout 1200 ./gradlew :app:assembleRelease --console=plain --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk inputsharex-android.apk
          else
            timeout 1200 ./gradlew :app:assembleDebug --console=plain --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk inputsharex-android.apk
          fi

      - name: Build Android control relay from source
        shell: bash
        run: |
          set -euo pipefail
          classes="$RUNNER_TEMP/control-relay/classes"
          dex="$RUNNER_TEMP/control-relay/dex"
          android_jar="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p "$classes" "$dex"
          javac -source 8 -target 8 -cp "$android_jar" -d "$classes" tools/control-relay/*.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$android_jar" --min-api 26 --output "$dex" "$classes"/*.class
          jar cf vendor/inputsharex-relay.jar -C "$dex" classes.dex

      - name: Upload control relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-relay
          path: vendor/inputsharex-relay.jar
          if-no-files-found: error

      - name: Test pointer dump parsing
        shell: bash
        run: |
          set -euo pipefail
          classes="$RUNNER_TEMP/pointer-tests"
          android_jar="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p "$classes"
          javac -cp "$android_jar" -d "$classes" tools/control-relay/InputShareXPointerProbe.java tools/control-relay/tests/PointerParserTest.java tools/control-relay/InputShareXTouchScroll.java tools/control-relay/tests/TouchScrollTest.java
          java -cp "$classes:$android_jar" PointerParserTest
          java -cp "$classes:$android_jar" TouchScrollTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/inputsharex-android.apk
          if-no-files-found: error

  windows:
    name: Build Windows EXE
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=43" "PySide6-Essentials>=6.6" "pyinstaller>=6.0" "segno>=1.5"

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk

      - name: Download compiled control relay
        uses: actions/download-artifact@v4
        with:
          name: control-relay
          path: vendor

      - name: Bundle APK into vendor
        shell: bash
        run: cp android-apk/inputsharex-android.apk vendor/inputsharex-android.apk

      - name: Run Python tests
        shell: bash
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import runpy
          files = (
              "protocol", "wifi", "session", "direct", "devices", "pairing",
              "androidapp", "keyboard", "clipboard", "qr_flow", "update",
              "sharing", "imports", "absolute",
          )
          total = 0
          for name in files:
              module = runpy.run_path("tests/test_" + name + ".py")
              tests = [value for key, value in module.items() if key.startswith("test_") and callable(value)]
              for test in tests:
                  test()
              total += len(tests)
          print(total, "tests passed")
          PY

      - name: Build InputShareX.exe
        shell: powershell
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          .\build-desktop.ps1 -SkipIcon -OutputDirectory out

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: out/InputShareX.exe
          if-no-files-found: error

  release:
    name: Attach assets to release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: assets

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: assets

      - name: Rename APK with version
        shell: bash
        run: |
          mv assets/inputsharex-android.apk "assets/inputsharex-android-${{ needs.android.outputs.version }}.apk"

      - name: Prepare release notes and checksums
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ -f "docs/releases/$GITHUB_REF_NAME.md" ]]; then
            cp "docs/releases/$GITHUB_REF_NAME.md" "$notes"
          else
            printf '## %s\n\n自动构建的 Windows 客户端与 Android 配套应用。\n' "$GITHUB_REF_NAME" > "$notes"
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          (cd assets && sha256sum InputShareX.exe *.apk > SHA256SUMS.txt)

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            assets/SHA256SUMS.txt
            assets/InputShareX.exe
            assets/inputsharex-android-${{ needs.android.outputs.version }}.apk
          fail_on_unmatched_files: true
